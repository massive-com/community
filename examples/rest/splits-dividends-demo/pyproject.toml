[project]
name = "splits-dividends-demo"
version = "1.0.0"
description = "This shows off the Massive splits and dividends endpoints"
authors = [{ name = "Alex Novotny", email = "alex.novotny@massive.com" }]
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "python-dotenv",
    "massive",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"