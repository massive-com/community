[project]
name = "pdt-intraday-risk-console"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "massive>=2.3.2",
  "streamlit>=1.36.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
